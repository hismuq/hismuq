<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520" role="img" aria-labelledby="t d">
  <title id="t">How I structure healthcare AI systems</title>
  <desc id="d">A user request reaches an AI agent. The agent works with retrieval, tools and guardrails, passes through a healthcare workflow, and ends in a bounded outcome: an answer or an escalation. A conceptual diagram, not a deployed architecture.</desc>
  <style>.m{opacity:0;fill:none}
.sig{stroke:#2747e0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 200;animation-duration:36s;animation-iteration-count:infinite;animation-timing-function:linear}
.s0{animation-name:s0}.s1{animation-name:s1}.s2{animation-name:s2}
.hl{stroke:#2747e0;stroke-width:1.5;animation-duration:36s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.h0{animation-name:h0}.h1{animation-name:h1}.h2{animation-name:h2}
@keyframes s0{0%{opacity:0;stroke-dashoffset:8}0.4%{opacity:1;stroke-dashoffset:8}30%{opacity:1;stroke-dashoffset:-100}30.4%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}@keyframes s1{0%{opacity:0;stroke-dashoffset:8}33.3%{opacity:0;stroke-dashoffset:8}33.7%{opacity:1;stroke-dashoffset:8}63.3%{opacity:1;stroke-dashoffset:-100}63.7%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}@keyframes s2{0%{opacity:0;stroke-dashoffset:8}66.6%{opacity:0;stroke-dashoffset:8}67%{opacity:1;stroke-dashoffset:8}96.6%{opacity:1;stroke-dashoffset:-100}97%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}
@keyframes h0{0%{opacity:0}12%{opacity:0}14.4%{opacity:0.9}20%{opacity:0}100%{opacity:0}}@keyframes h1{0%{opacity:0}45.3%{opacity:0}47.7%{opacity:0.9}53.3%{opacity:0}100%{opacity:0}}@keyframes h2{0%{opacity:0}78.6%{opacity:0}81%{opacity:0.9}86.6%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.m{animation:none!important;opacity:0!important}}</style>
